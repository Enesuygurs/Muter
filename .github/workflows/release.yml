name: Release

# Pushing a tag like v1.3 builds, tests and publishes Muter.v1.3.zip as a GitHub release. The tag must match the
# version in Muter/Properties/AssemblyInfo.cs. If the release already exists (e.g. created on github.com together
# with the tag), the zip is attached to it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check that the tag matches the app version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $info = Get-Content Muter/Properties/AssemblyInfo.cs -Raw
          if ($info -notmatch 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.(\d+)"\)') { throw 'AssemblyVersion not found' }
          # Same form as the version shown in the app: 1.3 or 1.3.1
          $version = if ([int]$Matches[3] -gt 0) { "$($Matches[1]).$($Matches[2]).$($Matches[3])" } else { "$($Matches[1]).$($Matches[2])" }
          if ($tag -ne "v$version") { throw "Tag $tag does not match the app version $version. Bump AssemblyVersion first." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Muter.sln -c Release -nologo

      - name: Test
        run: dotnet test Muter.sln -c Release --no-build -nologo --filter "FullyQualifiedName!~Muter.Tests.Hardware"

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path Muter/bin/Release/Muter.exe, Muter/bin/Release/Muter.exe.config -DestinationPath "Muter.v${{ steps.version.outputs.version }}.zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "Muter.v${{ steps.version.outputs.version }}.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Muter ${{ steps.version.outputs.version }}" --generate-notes --latest
          }
